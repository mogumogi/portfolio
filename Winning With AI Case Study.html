  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"0b3fa54c-2450-4246-89cf-b110efad4170\"><\u002Fscript>\n<script src=\"91420b00-661e-4ccb-8577-6079ba7eade7\"><\u002Fscript>\n<style>\n  body { margin: 0; }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent); text-decoration: underline; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--color-accent:#7a1f2b;--color-accent-700:#551520;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow-x:hidden\">\n\n<header style=\"border-bottom:2px solid var(--color-divider)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:14px clamp(20px,4vw,48px);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase\">\n    <span>01 / Featured project<\u002Fspan>\n    <span class=\"text-muted\">Case study — Project Coordination<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section data-screen-label=\"Hero\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <p style=\"margin:0 0 clamp(20px,3vw,32px);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Narasio Data × U.S. Mission Indonesia · 22 July 2026 · Surabaya<\u002Fp>\n  <h1 style=\"margin:0;font-size:clamp(52px,12.5vw,168px);line-height:.88;letter-spacing:-.035em;text-transform:uppercase\">Winning<br>With AI<\u002Fh1>\n  <div style=\"margin-top:clamp(28px,4vw,48px);display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:flex-end;justify-content:space-between\">\n    <div>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(22px,2.6vw,34px);line-height:1.1\">Project Coordinator<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:15px;max-width:44ch\" class=\"text-muted\">An executive seminar on AI for business leaders, held at My America Surabaya inside the U.S. Consulate General.<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:clamp(18px,2vw,24px);line-height:1.35;font-weight:600;max-width:36ch;border-left:2px solid var(--color-accent);padding-left:20px\">More than a campaign. A project I helped coordinate from planning to execution.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<figure style=\"margin:clamp(40px,6vw,80px) 0 0;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)\">\n  <img src=\"4c456b9e-6995-4474-ac97-52579171674f\" alt=\"Attendees of Winning With AI at My America Surabaya\" class=\"{{ photoClass }}\" style=\"width:100%;height:clamp(260px,46vw,620px);object-fit:cover\">\n  <figcaption style=\"max-width:1280px;margin:0 auto;padding:10px clamp(20px,4vw,48px)\">44 attendees at the close of the seminar — My America, U.S. Consulate General Surabaya, 22 July 2026.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<section data-screen-label=\"Positioning\" style=\"background:var(--color-accent);color:var(--color-bg)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px)\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(28px,4.6vw,64px);line-height:1.05;letter-spacing:-.02em;max-width:30ch;text-wrap:pretty\">From concept to execution, I helped bring Winning With AI from an idea into a real-world event.<\u002Fp>\n    <div style=\"margin-top:clamp(32px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px;background:var(--color-accent)\">\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Project Coordination<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Marketing<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Creative Direction<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Content &amp; Communication<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Event Execution<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Stakeholder Coordination<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Problem Solving<\u002Fspan>\n      <span style=\"background:var(--color-accent);outline:2px solid color-mix(in srgb,#f3f2f2 45%,transparent);padding:14px 16px;font-family:var(--font-heading);font-weight:800;font-size:15px\">Data / Analytical Thinking<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"01 Snapshot\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">01<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Project snapshot<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px)\">The Project<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0 0\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))\">\n    <div style=\"padding:20px 20px 20px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Project<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">Winning With AI<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">What Business Leaders Need to Know to Stay Ahead in an AI-Driven Economy<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-bottom:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Role<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">Project Coordinator<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">Project lead on the internal manpower plan<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-bottom:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Industry<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">AI &amp; Technology · Business Education<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px 20px 20px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Format<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">Offline executive seminar<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">90-minute programme, 30-minute networking<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-bottom:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Year<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">2026<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">Wednesday, 22 July · 13:30–15:30 WIB<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-bottom:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Duration<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">2 months<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">Briefing late May to post-event reporting<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px 20px 20px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Location<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">Surabaya, Indonesia<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">My America, U.S. Consulate General Surabaya · Jl. Citra Raya Niaga No. 2<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-bottom:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Audience<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">Business leaders &amp; executive managers<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">Business owners and founders, C-level executives, innovation and digital transformation leads<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-bottom:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Partner<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:19px;line-height:1.25\">U.S. Mission Indonesia<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:13px\" class=\"text-muted\">@America / myAmerica, U.S. Consulate General Surabaya<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font-size:14px;max-width:70ch\" class=\"text-muted\">Working title during planning: <em>Intelligence-Driven Marketing for Indonesian Businesses<\u002Fem>. The programme was published as Winning With AI.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Challenge\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">02<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">The challenge<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);max-width:26ch;text-wrap:pretty\">Why the event existed<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,56px)\">\n    <div style=\"flex:1 1 380px;min-width:0\">\n      <h3 style=\"margin:0 0 12px;font-size:20px\">The opportunity<\u002Fh3>\n      <p style=\"font-size:17px;line-height:1.6\">A hands-on seminar exploring how AI-powered marketing intelligence can help Indonesian businesses make smarter decisions, understand their customers more deeply, and uncover growth opportunities in an increasingly competitive market.<\u002Fp>\n      <h3 style=\"margin:28px 0 12px;font-size:20px\">The audience<\u002Fh3>\n      <p style=\"font-size:17px;line-height:1.6\">Business owners and executives aged 35–50, most of them beginners with AI and working at surface level with tools like ChatGPT, Claude and Gemini. They came for practical implementation strategies tied to real business work — case studies, live demos, and open Q&amp;A — and for the chance to network with other owners and AI professionals.<\u002Fp>\n      <h3 style=\"margin:28px 0 12px;font-size:20px\">What success required<\u002Fh3>\n      <p style=\"font-size:17px;line-height:1.6\">Four KPIs were set before planning began: a full room of 40 attendees at a 100% turn-up rate, an 80% satisfaction rate from the feedback form, 10 qualified leads for the BD team, and 50% of attendees downloading the digital business card product.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 320px;min-width:0\">\n      <p style=\"margin:0 0 16px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase\" class=\"text-muted\">Five objectives<\u002Fp>\n      <div style=\"border-top:2px solid var(--color-divider)\">\n        <div style=\"padding:16px 0;border-bottom:2px solid var(--color-divider)\">\n          <p style=\"margin:0 0 4px;font-family:var(--font-heading);font-weight:800;font-size:17px\">Awareness<\u002Fp>\n          <p style=\"margin:0;font-size:15px\" class=\"text-muted\">Increase awareness of AI-powered marketing intelligence and US-based AI programmes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:16px 0;border-bottom:2px solid var(--color-divider)\">\n          <p style=\"margin:0 0 4px;font-family:var(--font-heading);font-weight:800;font-size:17px\">Brand exposure<\u002Fp>\n          <p style=\"margin:0;font-size:15px\" class=\"text-muted\">Introduce Narasio Data to the room and build a strong association with the @America brand.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:16px 0;border-bottom:2px solid var(--color-divider)\">\n          <p style=\"margin:0 0 4px;font-family:var(--font-heading);font-weight:800;font-size:17px\">Lead generation<\u002Fp>\n          <p style=\"margin:0;font-size:15px\" class=\"text-muted\">Generate qualified leads from attending business owners for the BD team's CRM.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:16px 0;border-bottom:2px solid var(--color-divider)\">\n          <p style=\"margin:0 0 4px;font-family:var(--font-heading);font-weight:800;font-size:17px\">Stakeholder engagement<\u002Fp>\n          <p style=\"margin:0;font-size:15px\" class=\"text-muted\">Build a lasting relationship with @America, opening the door to a second joint event.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:16px 0;border-bottom:2px solid var(--color-divider)\">\n          <p style=\"margin:0 0 4px;font-family:var(--font-heading);font-weight:800;font-size:17px\">Thought leadership<\u002Fp>\n          <p style=\"margin:0;font-size:15px\" class=\"text-muted\">Introduce AI technology from the U.S. and position Surabaya as a centre of business innovation.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 My Role\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">03<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">My role<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.9vw,52px);max-width:24ch;text-wrap:pretty\">I wasn't just working on one piece. I was coordinating the whole picture.<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0\">\n  <p style=\"font-size:17px;line-height:1.6;max-width:70ch\">Others owned their functions — speaking, design, logistics. My job was keeping them pointed at the same date.<\u002Fp>\n  <div style=\"margin-top:clamp(24px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;background:var(--color-bg)\">\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">01<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Project planning<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Built the running folder and timeline sheet, and ran the internal meeting on overview, objectives, resources and budget.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">02<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Stakeholder coordination<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Led the on-site meeting with the Consulate on venue, participant flow, the rundown and the MoU, and kept them updated through to the day.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">03<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Marketing &amp; social media<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Published one main flyer plus weekly posts across Instagram, LinkedIn and TikTok, with registration on Linktree, up to cut-off.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">04<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Creative direction<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Designed the flyer, form headers, speaker deck and final report template — all to Narasio Data's branding.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">05<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Registration &amp; participant comms<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Confirmed every registrant's name and email for the Consulate's security screening, then sent the pre-event reminder.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">06<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Event day<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Ran the briefing and technical check, confirmed speakers were ready, and kept documentation running through every session.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">07<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Testimonial interviews<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Wrote the interview questions used to collect participant testimonials after the event.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--color-accent-700)\">08<\u002Fp>\n      <h3 style=\"margin:0 0 10px;font-size:20px\">Post-event<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Ran the H+1 evaluation, produced the final report, sent it to the Consulate, and published the advertorial post and video.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 The Plan\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">04<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">The plan<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px)\">Two months, six phases<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0 0\">\n  <div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);padding:28px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0;flex:0 0 68px;font-family:var(--font-heading);font-weight:800;font-size:28px;line-height:1\">01<\u002Fp>\n      <div style=\"flex:1 1 200px;min-width:0\">\n        <h3 style=\"margin:0 0 4px;font-size:22px\">Briefing &amp; setup<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\" class=\"text-muted\">25–26 May<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;flex:2 1 360px;min-width:0;font-size:16px;line-height:1.6\">C-level briefing, then the running folder and timeline sheet the project ran on.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);padding:28px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0;flex:0 0 68px;font-family:var(--font-heading);font-weight:800;font-size:28px;line-height:1\">02<\u002Fp>\n      <div style=\"flex:1 1 200px;min-width:0\">\n        <h3 style=\"margin:0 0 4px;font-size:22px\">Alignment<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\" class=\"text-muted\">5 June internal · 12 June at the Consulate<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;flex:2 1 360px;min-width:0;font-size:16px;line-height:1.6\">Internal meeting on overview, objectives and budget, then an on-site meeting with the Consulate on venue, flow, rundown and the MoU.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);padding:28px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0;flex:0 0 68px;font-family:var(--font-heading);font-weight:800;font-size:28px;line-height:1\">03<\u002Fp>\n      <div style=\"flex:1 1 200px;min-width:0\">\n        <h3 style=\"margin:0 0 4px;font-size:22px\">Build &amp; promote<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\" class=\"text-muted\">June, weeks 2–5<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;flex:2 1 360px;min-width:0;font-size:16px;line-height:1.6\">Flyer published across social channels, forms live, speaker deck and report template designed, testimonial questions written.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);padding:28px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0;flex:0 0 68px;font-family:var(--font-heading);font-weight:800;font-size:28px;line-height:1\">04<\u002Fp>\n      <div style=\"flex:1 1 200px;min-width:0\">\n        <h3 style=\"margin:0 0 4px;font-size:22px\">Final preparation<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\" class=\"text-muted\">July, to 21 July<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;flex:2 1 360px;min-width:0;font-size:16px;line-height:1.6\">Technical meeting and speaker rehearsal. Registration closed 19 July for the Consulate's security screening, followed by name checks and a reminder.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);padding:28px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0;flex:0 0 68px;font-family:var(--font-heading);font-weight:800;font-size:28px;line-height:1;color:var(--color-accent)\">05<\u002Fp>\n      <div style=\"flex:1 1 200px;min-width:0\">\n        <h3 style=\"margin:0 0 4px;font-size:22px\">Event day<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\" class=\"text-muted\">22 July<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;flex:2 1 360px;min-width:0;font-size:16px;line-height:1.6\">Technical check, screening, the 14:00–15:30 programme, then networking, the Kartio demo and testimonials.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,48px);padding:28px 0;border-bottom:2px solid var(--color-divider)\">\n      <p style=\"margin:0;flex:0 0 68px;font-family:var(--font-heading);font-weight:800;font-size:28px;line-height:1\">06<\u002Fp>\n      <div style=\"flex:1 1 200px;min-width:0\">\n        <h3 style=\"margin:0 0 4px;font-size:22px\">Post-event<\u002Fh3>\n        <p style=\"margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase\" class=\"text-muted\">H+1 to H+2<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;flex:2 1 360px;min-width:0;font-size:16px;line-height:1.6\">H+1 evaluation, final report sent to the Consulate as a PDF, and the advertorial post and video.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 The Creative\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">05<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">The creative<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);max-width:28ch;text-wrap:pretty\">One visual language, from the first post to the last slide<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px)\">\n    <figure style=\"flex:1 1 380px;min-width:0\">\n      <img src=\"a3037b53-f78c-45ca-92b9-cd39ebef56b3\" alt=\"Winning With AI seminar flyer\" style=\"width:100%;box-shadow:var(--shadow-md)\">\n      <figcaption style=\"font-size:13px;margin-top:10px\">Main event flyer — the promise, speakers, takeaways, audience and venue in one frame.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <div style=\"flex:1 1 320px;min-width:0;align-self:center\">\n      <h3 style=\"margin:0 0 12px;font-size:22px\">Designed to be read by executives<\u002Fh3>\n      <p style=\"font-size:17px;line-height:1.6\">The flyer carried the Narasio Data × U.S. Mission Indonesia lock-up and led with the speakers. The same type and framing ran through the form headers, deck and final report.<\u002Fp>\n      <div style=\"margin-top:24px;border-top:2px solid var(--color-divider)\">\n        <p style=\"margin:0;padding:12px 0;border-bottom:2px solid var(--color-divider);font-size:15px\">Main flyer plus three weekly posts to the cut-off<\u002Fp>\n        <p style=\"margin:0;padding:12px 0;border-bottom:2px solid var(--color-divider);font-size:15px\">Registration and feedback form headers<\u002Fp>\n        <p style=\"margin:0;padding:12px 0;border-bottom:2px solid var(--color-divider);font-size:15px\">Speaker material deck, designed to brand<\u002Fp>\n        <p style=\"margin:0;padding:12px 0;border-bottom:2px solid var(--color-divider);font-size:15px\">Event banner, plaque and Kartio postcard<\u002Fp>\n        <p style=\"margin:0;padding:12px 0;border-bottom:2px solid var(--color-divider);font-size:15px\">Final report template<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:clamp(24px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3vw,32px)\">\n    <figure>\n      <img src=\"df636312-c60a-4ecb-890b-05c1be50b82e\" alt=\"Registration form header artwork\" style=\"width:100%;box-shadow:var(--shadow-md)\">\n      <figcaption style=\"font-size:13px;margin-top:10px\">Registration form header.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure>\n      <img src=\"4ac3ebe2-2912-4aea-a944-80a60f309308\" alt=\"Feedback form header artwork\" style=\"width:100%;box-shadow:var(--shadow-md)\">\n      <figcaption style=\"font-size:13px;margin-top:10px\">Feedback form header — source of the satisfaction score.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n  <div style=\"margin-top:clamp(24px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,3vw,32px)\">\n    <figure>\n      <image-slot id=\"wwai-deck\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:260px;background:var(--color-surface);box-shadow:var(--shadow-md)\" placeholder=\"Drop a speaker deck slide\" src=\"3689950c-2898-4019-9d52-520da18f2d47\"><\u002Fimage-slot>\n      <figcaption style=\"font-size:13px;margin-top:10px\">Speaker material deck — content copyright fully belongs to the creator, Bagus Jati Santoso, Ph.D.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure>\n      <image-slot id=\"wwai-report\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:260px;background:var(--color-surface);box-shadow:var(--shadow-md)\" placeholder=\"Drop a final report page\" src=\"b4869eaf-a7bb-4d4b-bba2-0108dec16574\"><\u002Fimage-slot>\n      <figcaption style=\"font-size:13px;margin-top:10px\">Final report deck — analysis and design by Felicia.<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Marketing\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Marketing &amp; communication<\u002Fp>\n  <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px)\">How the room was filled<\u002Fh2>\n  <hr class=\"hr\" style=\"margin:clamp(20px,3vw,32px) 0\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:2px;background:var(--color-bg)\">\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Audience<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Business owners, founders and C-level executives in Surabaya, curious about AI but working at surface level with it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Message<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">What business leaders need to know to stay ahead in an AI-driven economy — practical, not technical.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Channel<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Organic Instagram, LinkedIn and TikTok, the registration link on Linktree, and WhatsApp for everyone who signed up.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Creative<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">One main flyer plus three weekly posts to the cut-off, form headers, and the post-event advertorial in image and video.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Execution<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.55\">Published from mid-June, approved by the Consulate for tagging, closed on 19 July.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font-size:15px;max-width:74ch\" class=\"text-muted\">66 people applied, 58 were selected and invited, and 44 attended — above the 40-seat target. The campaign ran organically, with no paid media.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Coordination\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">06<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">The coordination<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);max-width:28ch;text-wrap:pretty\">Ten moving parts, one date<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0\">\n  <p style=\"font-size:17px;line-height:1.6;max-width:70ch\">Each function had its own owner. Coordination meant keeping them all pointed at the same date.<\u002Fp>\n  <div style=\"margin-top:clamp(24px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:var(--color-bg)\">\n    <div style=\"background:var(--color-accent);color:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\">Centre<\u002Fp>\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:22px;line-height:1.15\">Project coordination<\u002Fp>\n      <p style=\"margin:8px 0 0;font-size:14px;line-height:1.5\">Timeline, meetings, promotion, creative, reporting.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Speakers &amp; moderator<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Bagus Jati Santoso, Oumama Kabli, and moderator Lita Hendranata. Coordinated by Hilda.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Venue &amp; security<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">myAmerica — building access and participant screening.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Registration<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Team BD, checking registrants against turn-up.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Technical<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Aldo — deck, display and mics.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Time keeping<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Hilda, against the printed rundown.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Documentation<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">myAmerica's team, plus Ribkah for Narasio.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Product — Kartio<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Hilda — stage intro and hand-out at the close.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Logistics<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Hilda and Shafa — snackboxes, prints, chairs, the plaque.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:17px\">Testimonials<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:14px;line-height:1.5\" class=\"text-muted\">Salsa, Shafa, Ribkah and Hilda, on my interview questions.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"07 Problem Solving\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">07<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Problem solving<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.9vw,52px);max-width:24ch;text-wrap:pretty\">Things Don't Always Go According to Plan.<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0 0\">\n  <div>\n    <div style=\"padding:clamp(28px,4vw,44px) 0;border-bottom:2px solid var(--color-divider);display:flex;flex-wrap:wrap;gap:clamp(20px,3vw,48px)\">\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Challenge 01<\u002Fp>\n        <h3 style=\"margin:0 0 10px;font-size:22px\">A consulate is not a hotel ballroom<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">The venue restricts electronic devices. We needed a phone and camera inside, and no Bluetooth was allowed.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\" class=\"text-muted\">Response<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">Raised it early: approval for one phone and camera, wired mics only, documentation under myAmerica's supervision.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\" class=\"text-muted\">Outcome<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">Approved. Documentation ran all sessions; testimonials were filmed outside the building.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:clamp(28px,4vw,44px) 0;border-bottom:2px solid var(--color-divider);display:flex;flex-wrap:wrap;gap:clamp(20px,3vw,48px)\">\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Challenge 02<\u002Fp>\n        <h3 style=\"margin:0 0 10px;font-size:22px\">Every guest had to clear security<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">Attendance depended on security screening outside our control: names had to match IDs exactly, and the list had to close three days out.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\" class=\"text-muted\">Response<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">Closed registration 19 July and confirmed every name and email over WhatsApp.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\" class=\"text-muted\">Outcome<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">List submitted on schedule. 66 applied, 58 invited, 44 attended — above the 40 target.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:clamp(28px,4vw,44px) 0;border-bottom:2px solid var(--color-divider);display:flex;flex-wrap:wrap;gap:clamp(20px,3vw,48px)\">\n      <div style=\"flex:1 1 280px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700)\">Challenge 03<\u002Fp>\n        <h3 style=\"margin:0 0 10px;font-size:22px\">The partner couldn't promote it<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">The Consulate could only tag us on Instagram — no repost, no collaborative post. The audience had to come from our own reach.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\" class=\"text-muted\">Response<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">Ran it as a schedule: main flyer mid-June, weekly posts to cut-off, final flyer sent over for tagging.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 220px;min-width:0\">\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase\" class=\"text-muted\">Outcome<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">66 applications from our own channels — well past the 40 seats.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"08 Results\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px) 0\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n    <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">08<\u002Fp>\n    <div style=\"flex:1 1 420px;min-width:0\">\n      <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">The results<\u002Fp>\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px)\">Measured against the targets<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px;background:var(--color-bg)\">\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:28px 24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(48px,6vw,76px);line-height:.9;color:var(--color-accent)\">44<\u002Fp>\n      <p style=\"margin:12px 0 0;font-family:var(--font-heading);font-weight:800;font-size:16px\">Attendees on the day<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:14px\" class=\"text-muted\">Target: 40 · 66 applied · 58 selected<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:28px 24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(48px,6vw,76px);line-height:.9;color:var(--color-accent)\">93%<\u002Fp>\n      <p style=\"margin:12px 0 0;font-family:var(--font-heading);font-weight:800;font-size:16px\">Participant satisfaction<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:14px\" class=\"text-muted\">Target: 80% good or excellent · from the feedback form<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-bg);outline:2px solid var(--color-divider);padding:28px 24px\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(48px,6vw,76px);line-height:.9;color:var(--color-accent)\">2/2<\u002Fp>\n      <p style=\"margin:12px 0 0;font-family:var(--font-heading);font-weight:800;font-size:16px\">Predefined KPIs exceeded<\u002Fp>\n      <p style=\"margin:4px 0 0;font-size:14px\" class=\"text-muted\">Attendance and satisfaction both above target<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:clamp(28px,4vw,44px) 0 0;font-size:clamp(19px,2.2vw,26px);line-height:1.4;font-weight:600;max-width:46ch;border-left:2px solid var(--color-accent);padding-left:20px\">Both predefined event KPIs exceeded their targets, demonstrating strong participant engagement and successful delivery of the programme objectives.<\u002Fp>\n<\u002Fsection>\n\n<section data-screen-label=\"09 Reflection\" style=\"margin:clamp(48px,7vw,96px) 0 0;border-top:2px solid var(--color-divider)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);align-items:baseline\">\n      <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,6vw,88px);line-height:.9;color:var(--color-accent);flex:0 0 auto\">09<\u002Fp>\n      <div style=\"flex:1 1 420px;min-width:0\">\n        <p style=\"margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">The reflection<\u002Fp>\n        <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,44px)\">What I learned<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <hr class=\"hr\" style=\"margin:clamp(24px,3vw,40px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,56px)\">\n      <div style=\"flex:1 1 320px;min-width:0\">\n        <h3 style=\"margin:0 0 10px;font-size:20px\">Coordination is mostly noticing<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6\">The timeline sheet did not run the project. Reading it every week did. Most of what I contributed was catching the thing that had not moved — an unconfirmed deck, an unanswered question to the Consulate — while there was still time for it to matter.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0\">\n        <h3 style=\"margin:0 0 10px;font-size:20px\">Ask the awkward questions early<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6\">Devices, microphones, registration slots, snackbox pickup, whether the partner could repost. None of these were comfortable to ask about two months out, and every one of them would have been a crisis on the day. The coordination list was the most useful document I made.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0\">\n        <h3 style=\"margin:0 0 10px;font-size:20px\">Constraints are part of the brief<\u002Fh3>\n        <p style=\"font-size:17px;line-height:1.6\">A venue that limits cameras, a partner that can only tag, ninety minutes for nine items. Working inside those limits rather than arguing with them is what made the event feel considered instead of compromised.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;photoTreatment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Grayscale&quot;,&quot;Full colour&quot;],&quot;default&quot;:&quot;Grayscale&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Imagery&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const p = this.props;\n    return {\n      photoClass: (p.photoTreatment ?? 'Grayscale') === 'Grayscale' ? 'grayscale' : '',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
